# ==============================================================
# ATLAS IELTS Academy — backend tooling & metadata
#
# NOTE: runtime dependencies intentionally live in requirements.txt
# (the Dockerfile installs it directly). This file is metadata +
# lint/format configuration; the app is never pip-installed as a
# package, so there is no [build-system].
# ==============================================================

[project]
name = "atlas-ielts-backend"
version = "1.0.0"
description = "ATLAS IELTS Academy — 270-day AI-coached Academic IELTS preparation platform (FastAPI backend)"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ATLAS IELTS Academy contributors" }]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes · I isort · B bugbear · UP pyupgrade
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's `param: T = Depends(...)` is the framework's
# intended pattern, not a mutable-default bug.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]