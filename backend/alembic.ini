# ==============================================================
# ATLAS IELTS Academy — Alembic configuration
#
# The database URL is NEVER stored here: alembic/env.py injects it
# from app.config (DATABASE_URL — env var or .env), so this file
# stays identical across dev/docker/production.
# ==============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
# Rendered empty; env.py calls config.set_main_option() first.
sqlalchemy.url =
# Future revisions name themselves like 0002_add_column_x
file_template = %%(rev)s_%%(slug)s
# Timezone in file headers
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S