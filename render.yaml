# ==============================================================
# ATLAS IELTS Academy — Render blueprint (NO DATABASE edition)
#
# Deploy the whole stack from the repo root with a Blueprint:
#   Render Dashboard → New → Blueprint → pick this repo.
#
# Persistence is ONE JSON file (store.py) inside the container.
# ⚠ On ephemeral disks (Render free/starter without a disk) a
#   REDEPLOY resets progress. To keep data across redeploys,
#   add a Render Disk and set DATA_FILE=/data/atlas_data.json.
#
# ⚠ .env is gitignored and .dockerignore'd — it NEVER reaches
#   Render. All runtime config comes from these env vars.
# ==============================================================

services:
  - type: web
    name: atlas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health          # main.py's liveness probe
    plan: starter                     # free tier sleeps & kills long AI generations
    autoDeploy: true
    envVars:
      - key: DATA_FILE
        value: /data/atlas_data.json  # requires a Render Disk (see below)
      - key: JWT_SECRET
        generateValue: true           # Render mints + PERSISTS a strong secret
      - key: OPENROUTER_API_KEY
        sync: false                   # paste in the Render dashboard (secret)
      - key: GROQ_API_KEY
        sync: false                   # paste in the Render dashboard (secret)
      - key: FRONTEND_ORIGIN
        sync: false                   # e.g. https://atlas-ielts.vercel.app
                                      # comma-separated for extra origins

# OPTIONAL (paid) — uncomment to persist the JSON store across redeploys:
#   disks:
#     - name: atlas-data
#       diskSizeGB: 1
#       mountPath: /data

