# ==============================================================
# ATLAS IELTS Academy — one command runs everything (NO DATABASE)
#   cp .env.example .env  (fill in keys)  →  docker compose up -d --build
#
# Persistence is a single JSON file (backend store.py, DATA_FILE
# env) written inside the container / bind mount — no MySQL, no
# migrations, no DB containers.
# ==============================================================

name: atlas-ielts-academy

services:

  backend:
    build:
      context: ./backend
    container_name: atlas_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app          # hot-reload source mount
      - backend_data:/app/data  # JSON store survives container rebuilds
    environment:
      DATA_FILE: /app/data/atlas_data.json
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: atlas_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # keep deps inside the container
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  backend_data:
  frontend_node_modules: